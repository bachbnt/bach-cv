<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bach CV v2 review</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1B1F27;color:#F5F6F8}
header{padding:20px 32px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #4A5160}
h1{font-size:18px;margin:0 24px 0 0}
button{font:500 14px system-ui;padding:8px 16px;border-radius:999px;border:1px solid #4A5160;background:transparent;color:#F5F6F8;cursor:pointer}
button[aria-pressed="true"]{background:#F5F6F8;color:#1B1F27}
.stage{display:flex;gap:40px;padding:32px;align-items:flex-start;overflow:auto}
.frame{flex:none;background:#fff;border-radius:8px;overflow:hidden}
.cap{font-size:13px;color:#B4BAC6;margin:0 0 8px}
iframe{border:0;display:block;transform-origin:0 0}
</style>
</head>
<body>
<header>
<h1>Bach CV v2: design review</h1>
<button data-p="index.html" aria-pressed="true">Home</button>
<button data-p="about.html" aria-pressed="false">About</button>
<button data-p="resume.html" aria-pressed="false">Resume</button>
<button data-p="projects.html" aria-pressed="false">Projects</button>
<button data-p="certificates.html" aria-pressed="false">Certificates</button>
<button data-p="services.html" aria-pressed="false">Services</button>
<button data-p="payment.html" aria-pressed="false">Payment</button>
<button data-p="cv.html" aria-pressed="false">CV (PDF)</button>
<button data-p="payment-all-on.html" aria-pressed="false">Payment: all on</button>
<button data-p="payment-none-on.html" aria-pressed="false">Payment: none on</button>
<span style="width:24px"></span><button data-p="states/index.html" aria-pressed="false">Off: index</button>
<button data-p="states/about.html" aria-pressed="false">Off: about</button>
<button data-p="states/resume.html" aria-pressed="false">Off: resume</button>
<button data-p="states/projects.html" aria-pressed="false">Off: projects</button>
<button data-p="states/certificates.html" aria-pressed="false">Off: certificates</button>
<button data-p="states/services.html" aria-pressed="false">Off: services</button>
<button data-p="coming-soon.html" aria-pressed="false">Coming soon</button>
<button data-p="404.html" aria-pressed="false">404</button>
<button data-p="index.html?chat=open" aria-pressed="false">Chat: open</button>
<button data-p="index.html?chat=typing" aria-pressed="false">Chat: typing</button>
<button data-p="index.html?chat=error" aria-pressed="false">Chat: error</button>
<button data-p="index.html?chat=limit" aria-pressed="false">Chat: limit</button>
</header>
<div class="stage">
<div><p class="cap">Desktop 1440</p><div class="frame" style="width:864px;height:760px"><iframe id="d" style="width:1440px;height:1267px;transform:scale(0.6)"></iframe></div></div>
<div><p class="cap">Mobile 390</p><div class="frame" style="width:390px;height:760px"><iframe id="m" style="width:390px;height:760px"></iframe></div></div>
</div>
<script>
var d=document.getElementById('d'),m=document.getElementById('m');
function load(p){d.src=p;m.src=p}
document.querySelectorAll('button[data-p]').forEach(function(b){b.addEventListener('click',function(){
document.querySelectorAll('button[data-p]').forEach(function(c){c.setAttribute('aria-pressed',String(c===b))});
load(b.dataset.p)})});
load('index.html');
</script>
</body>
</html>
